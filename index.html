<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="description"
        content="A special digital experience created for Jessica."
    >

    <meta name="theme-color" content="#050507">

    <title>For Jessica ❤️</title>

    <!-- ==============================
         FONTS
         ============================== -->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- ==============================
         STYLES
         ============================== -->

    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body>

    <!-- ==========================================
         APP ROOT
         ========================================== -->

    <main id="app">

        <!-- ======================================
             ATMOSPHERE
             ====================================== -->

        <div class="atmosphere" aria-hidden="true">

            <div class="ambient-glow ambient-glow--one"></div>
            <div class="ambient-glow ambient-glow--two"></div>
            <div class="ambient-glow ambient-glow--three"></div>

            <div class="noise-layer"></div>

            <canvas
                id="particleCanvas"
                aria-hidden="true"
            ></canvas>

        </div>


        <!-- ======================================
             CUSTOM CURSOR
             ====================================== -->

        <div
            id="cursor"
            class="cursor"
            aria-hidden="true"
        ></div>

        <div
            id="cursorFollower"
            class="cursor-follower"
            aria-hidden="true"
        ></div>


        <!-- ======================================
             LOADING SCREEN
             ====================================== -->

        <section
            id="loader"
            class="loader"
            aria-label="Loading"
        >

            <div class="loader__content">

                <div class="loader__symbol">
                    <span></span>
                </div>

                <p class="loader__small">
                    A little something is being prepared...
                </p>

                <div class="loader__name">
                    JESSICA
                </div>

                <div class="loader__progress">
                    <div
                        id="loaderProgress"
                        class="loader__progress-bar"
                    ></div>
                </div>

                <p
                    id="loaderStatus"
                    class="loader__status"
                >
                    INITIALIZING
                </p>

            </div>

        </section>


        <!-- ======================================
             MAIN EXPERIENCE
             ====================================== -->

        <div
            id="experience"
            class="experience"
            aria-hidden="true"
        >

            <!-- ==================================
                 SCENE CONTAINER
                 ================================== -->

            <div
                id="sceneContainer"
                class="scene-container"
            >

                <!-- ==============================
                     FOUNDATION SCENE
                     ============================== -->

                <section
                    id="scene-foundation"
                    class="scene scene--foundation active"
                    data-scene="foundation"
                >

                    <div class="scene__content">

                        <p class="eyebrow">
                            A DIGITAL EXPERIENCE
                        </p>

                        <h1 class="hero-title">
                            <span class="hero-title__line">
                                Something
                            </span>

                            <span class="hero-title__line hero-title__line--accent">
                                special
                            </span>

                            <span class="hero-title__line">
                                is waiting.
                            </span>
                        </h1>

                        <p class="hero-description">
                            This is only the beginning.
                        </p>

                        <button
                            id="foundationButton"
                            class="luxury-button"
                            type="button"
                        >

                            <span class="luxury-button__text">
                                ENTER
                            </span>

                            <span
                                class="luxury-button__arrow"
                                aria-hidden="true"
                            >
                                →
                            </span>

                        </button>

                    </div>


                    <!-- Decorative typography -->

                    <div
                        class="background-word"
                        aria-hidden="true"
                    >
                        JESSICA
                    </div>


                    <!-- Scene number -->

                    <div
                        class="scene-index"
                        aria-hidden="true"
                    >
                        <span>01</span>
                        <span class="scene-index__line"></span>
                        <span>∞</span>
                    </div>

                </section>

            </div>


            <!-- ==================================
                 GLOBAL UI
                 ================================== -->

            <div class="global-ui">

                <div class="global-ui__top">

                    <div class="brand-mark">
                        <span class="brand-mark__dot"></span>

                        <span>
                            FOR JESSICA
                        </span>
                    </div>

                    <div
                        id="currentTime"
                        class="current-time"
                    >
                        00:00
                    </div>

                </div>


                <div class="global-ui__bottom">

                    <div class="scroll-indicator">

                        <span class="scroll-indicator__line"></span>

                        <span>
                            AN EXPERIENCE IN MOTION
                        </span>

                    </div>

                    <div class="location-mark">
                        07 · 09
                    </div>

                </div>

            </div>

        </div>

    </main>


    <!-- ==========================================
         JAVASCRIPT
         ========================================== -->

    <script src="js/config.js"></script>
    <script src="js/particles.js"></script>
    <script src="js/app.js"></script>

</body>
</html>
